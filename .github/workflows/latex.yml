name: Compilar LaTeX

on:
  push:
    paths:
      - "pages/**"
      - ".github/workflows/latex.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: pages/InformacionColorimetria.tex

      - name: Diagnóstico
        run: |
          set -x

          echo "=============================="
          echo "DIRECTORIO ACTUAL"
          pwd

          echo "=============================="
          echo "LISTADO COMPLETO"
          ls -R

          echo "=============================="
          echo "PDF ENCONTRADOS"
          find . -name "*.pdf"

          echo "=============================="
          echo "ESTADO DE GIT ANTES"
          git status

      - name: Commit del PDF
        run: |
          set -x

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          if [ -f "pages/InformacionColorimetria.pdf" ]; then
            echo "PDF encontrado en pages/"
          elif [ -f "InformacionColorimetria.pdf" ]; then
            echo "PDF encontrado en la raíz"
            mv InformacionColorimetria.pdf pages/InformacionColorimetria.pdf
          else
            echo "ERROR: No se encontró ningún PDF generado."
            exit 1
          fi

          git add pages/InformacionColorimetria.pdf

          echo "=============================="
          git status

          if git diff --cached --quiet; then
            echo "No hay cambios para subir."
          else
            git commit -m "Actualizar PDF automáticamente"
            git push origin HEAD
          fi
