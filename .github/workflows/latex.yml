name: Compilar LaTeX

on:
  push:
    paths:
      - "pages/**"
      - ".github/workflows/latex.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: pages/InformacionColorimetria.tex

      - name: Preparar PDF
        run: |
          set -e
          set -x

          echo "=== Directorio actual ==="
          pwd

          echo "=== PDFs encontrados ==="
          find . -name "*.pdf"

          if [ -f "./InformacionColorimetria.pdf" ]; then
            echo "Moviendo PDF generado a pages/"
            mv -f ./InformacionColorimetria.pdf ./pages/InformacionColorimetria.pdf
          fi

          echo "=== Estado final ==="
          ls -l .
          ls -l ./pages

      - name: Commit del PDF
        run: |
          set -e
          set -x

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add pages/InformacionColorimetria.pdf

          git status

          if git diff --cached --quiet; then
            echo "No hay cambios para confirmar."
            exit 0
          fi

          git commit -m "Actualizar PDF automáticamente"
          git push
